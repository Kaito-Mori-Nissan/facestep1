on:
  workflow_call:
    inputs:
      APPLICATION_NAME:
        required: true
        type: string

jobs:
  test:
    name: ${{ inputs.APPLICATION_NAME }}
    runs-on: self-hosted
    environment: ${{ inputs.APPLICATION_NAME }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ inputs.APPLICATION_NAME }}"
        shell: bash
      
