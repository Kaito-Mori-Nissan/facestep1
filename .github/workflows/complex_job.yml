name: Complex job

on: push

jobs:
  complex-job:
    runs-on: self-hosted
    strategy:
      matrix:
        target: [sample1, sample2, sample3]
    environment: ${{ matrix.target }}
    steps:
      - run: echo "${{ matrix.target }}"
        shell: bash

  job3:
    needs: complex-job
    if: ${{ needs.complex-job.result == 'success' || needs.complex-job.result == 'skipped' }}
    runs-on: self-hosted
    steps:
      - run: echo "job3"
