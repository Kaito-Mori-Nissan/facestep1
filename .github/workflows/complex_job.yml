name: Complex job

on: push

jobs:
  complex-job:
    runs-on: self-hosted
    continue-on-error: true
    strategy:
      matrix:
        target: [sample1, sample2, sample3]
    environment: ${{ matrix.target }}
    steps:
      - run: echo "${{ matrix.target }}"
        shell: bash

  job:
    runs-on: self-hosted
    needs: [complex-job]
    steps:
      - run: echo "job"
