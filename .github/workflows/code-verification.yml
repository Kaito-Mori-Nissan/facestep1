name: Code Verification

on:
  workflow_call:
    inputs:
      PROJECT_NAME:
        description: 'Project name which need to be scanned'
        required: true
        type: string
      PROJECT_DIR:
        description: 'Project path to be scanned'
        required: true
        type: string
      STATIC_ANALYSIS_SCRIPTS_PATH:
        description: 'Path to static analysis scripts'
        required: true
        type: string
      STATIC_ANALYSIS_SETTINGS_PATH:
        description: 'Path to static analysis settings'
        required: true
        type: string

jobs:
  Bug-Finder:
    runs-on: self-hosted # PCU-POLYSPACE-EC2
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          /opt/MathWorks/R2024b/polyspace/bin/polyspace-bug-finder-server
          -options-file ${PROJECT_DIR}/app_common_option.txt
          -options-file ${PROJECT_DIR}/app_bf_option.txt
          -options-file ${STATIC_ANALYSIS_SETTINGS_PATH}/bug-finder-options.txt
          -checkers-selection-file ${STATIC_ANALYSIS_SETTINGS_PATH}/custom_config.xml
          -report-output-name ${PROJECT_NAME}_BugFinder
      - run: ls -l
      - run: python3 ${STATIC_ANALYSIS_SCRIPTS_PATH}/print_error_count.py bf ./bug-finder-results/Polyspace-Doc/${PROJECT_NAME}_BugFinder.html
      - name: Upload Bug-Finder Report
        uses: actions/upload-artifact@v4
        with:
          name: ${PROJECT_NAME}-Bug-FInder-${{ github.run_id }}
          path: ./bug-finder-results/**/*
          retention-days: 30


  Code-Prover:
    runs-on: self-hosted # PCU-POLYSPACE-EC2
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          /opt/MathWorks/R2024b/polyspace/bin/polyspace-code-prover-server
          -options-file ${PROJECT_DIR}/app_common_option.txt
          -options-file ${PROJECT_DIR}/app_cp_option.txt
          -options-file ${STATIC_ANALYSIS_SETTINGS_PATH}/code-prover-options.txt
          -report-output-name ${PROJECT_NAME}_CodeProver
      - run: ls -l
      - run: python3 ${STATIC_ANALYSIS_SCRIPTS_PATH}/print_error_count.py cp ./code-prover-results/Polyspace-Doc/${PROJECT_NAME}_CodeProver.html
      - name: Upload Code-Prover Report
        uses: actions/upload-artifact@v4
        with:
          name: ${PROJECT_NAME}-Code-Prover-${{ github.run_id }}
          path: ./code-prover-results/**/*
          retention-days: 30