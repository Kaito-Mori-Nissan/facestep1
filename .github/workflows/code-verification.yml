on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string

jobs:
  Bug-Finder:
    runs-on: self-hosted
    strategy:
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: check1
        env:
          MATRIX_CONTENT: ${{ toJson(matrix) }}
        run: echo "$MATRIX_CONTENT"
      - name: check2
        run: |
          echo "PROJECT: ${{ matrix.PROJECT_NAME }}"
          echo "DIR: ${{ matrix.PROJECT_DIR }}"